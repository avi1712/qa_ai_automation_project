name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        # Remote Toolshop SUT — do NOT use localhost (no local app in CI)
        BASE_URL: https://practicesoftwaretesting.com
        UI_BASE_URL: https://practicesoftwaretesting.com
      run: npx playwright test
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: reports/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: reports/allure-report/
        retention-days: 30
    - name: Generate static Allure into execution-report
      if: ${{ !cancelled() }}
      run: npm run allure:execution-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: execution-report
        path: execution-report/
        retention-days: 30
